<header class="medusa-navbar" data-medusa-navbar>
  <div class="container medusa-navbar__inner">
    <a href="{{ url_for('views.static_html', route='/') }}" class="medusa-navbar__brand" aria-label="MEDUSA home">
      <span class="medusa-brand-mark" aria-hidden="true">M</span><span class="medusa-brand-name">MEDUSA</span>
    </a>
    <button class="medusa-navbar__toggle" type="button" aria-expanded="false" aria-controls="medusa-primary-nav" data-medusa-nav-toggle>
      <span class="visually-hidden">Toggle navigation</span><span aria-hidden="true">☰</span>
    </button>
    <nav id="medusa-primary-nav" class="medusa-navbar__nav" aria-label="Primary navigation">
      <a href="{{ url_for('views.static_html', route='/') }}" class="medusa-nav-link{% if request.endpoint == 'views.static_html' and request.view_args.get('route') == 'index' %} is-active{% endif %}">Home</a>
      <a href="{{ url_for('challenges.listing') }}" class="medusa-nav-link{% if request.endpoint == 'challenges.listing' %} is-active{% endif %}">Challenges</a>
      <a href="{{ url_for('scoreboard.listing') }}" class="medusa-nav-link{% if request.endpoint == 'scoreboard.listing' %} is-active{% endif %}">Scoreboard</a>
      {% if authed() %}
        <a href="{{ url_for('views.settings') }}" class="medusa-nav-link{% if request.endpoint == 'views.settings' %} is-active{% endif %}">Settings</a>
        <span class="medusa-navbar__status" aria-label="Competition status: live"><span class="medusa-status-dot" aria-hidden="true"></span><span>LIVE</span></span>
        {% include "components/notifications.html" %}
        <a href="{{ url_for('auth.logout') }}" class="medusa-nav-link medusa-nav-link--secondary">Logout</a>
      {% else %}<a href="{{ url_for('auth.login') }}" class="medusa-nav-link medusa-nav-link--primary">Login</a>{% endif %}
    </nav>
  </div>
</header>
