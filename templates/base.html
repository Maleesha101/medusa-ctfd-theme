<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}MEDUSA{% endblock %}</title>
    {{ Assets.css("assets/scss/main.scss") }}
    {% block head %}{% endblock %}
  </head>
  <body class="medusa-shell">
    {% include "components/navbar.html" %}
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
    <footer class="container py-5">
      <div class="medusa-panel p-3 text-center">
        <small class="text-muted">MEDUSA CTF Platform</small>
      </div>
    </footer>
    {{ Assets.js("assets/js/app.js") }}
    {% block scripts %}{% endblock %}
  </body>
</html>
