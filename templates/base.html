<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}MEDUSA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('theme.static', path='css/main.css') }}" />
  </head>
  <body class="medusa-shell">
    <header class="container py-4">
      <nav class="medusa-panel d-flex align-items-center justify-content-between p-3">
        <div>
          <span class="medusa-badge">MEDUSA</span>
        </div>
        <div class="d-flex gap-3 align-items-center">
          <a href="/">Home</a>
          <a href="/challenges">Challenges</a>
          <a href="/scoreboard">Scoreboard</a>
          <a href="/login">Login</a>
          <button class="medusa-btn">ENTER THE ARENA</button>
        </div>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('theme.static', path='js/app.js') }}"></script>
  </body>
</html>
